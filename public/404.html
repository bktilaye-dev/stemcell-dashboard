<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>StemCell Dashboard</title>
    <script>
      // GitHub Pages SPA redirect: encode the path into the query string
      // and redirect to index.html which restores it via history.replaceState
      var pathSegmentsToKeep = 1; // keeps /autism-stemcell-dashboard prefix
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
